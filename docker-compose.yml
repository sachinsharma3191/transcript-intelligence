# Run the whole demo: API on :8000, web UI on :3000.
#   docker compose up --build
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: transcript-api
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: ./frontend
      args:
        # Browser code calls the API directly, so this must be the host-facing URL.
        NEXT_PUBLIC_API_URL: http://localhost:8000
        # debug | info | warn | error: how much the browser console logs
        NEXT_PUBLIC_LOG_LEVEL: info
    image: transcript-web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
